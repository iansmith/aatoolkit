# aatoolkit slopstop project config: Linear ticket backend and the four-tier
# model map for the slopstop process.
system = "linear"
key    = "AATK"                 # Linear team key (team "AiAssistantToolkit")
prefix = "AATK"                 # ticket prefix, e.g. AATK-1
tracking_dir = ".slopstop/ticket-active"
archive_dir  = ".slopstop/ticket-archive"   # project-local; avoids the protected ~/.claude default

# Tier→model map for the four-tier slopstop process.
# Table form (v3.1.0+): each tier is a sub-table with provider, model, and optional
# version. The tier gate matches on model family and, when pinned, a dotted-prefix
# version match (e.g. version = "4.6" matches claude-opus-4-6).
[tiers.huge]
provider = "anthropic"
model    = "opus"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"       # :design + huge-tier checks

[tiers.large]
provider = "anthropic"
model    = "opus"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"       # :tickets + failure-driven rewrites + drift checks

[tiers.medium]
provider = "anthropic"
model    = "sonnet"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"       # :run orchestrator + per-ticket reviewer/adversary subagents

[tiers.small]
provider = "anthropic"
model    = "sonnet"  # was 'haiku'; set 2026-08-01 (grand synchronization)
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"  # set 2026-08-01 (grand synchronization)

# PR code review backend for /slopstop-pr.
# "claude" → in-house /code-review (Skill); "coderabbit" → CodeRabbit bot;
# "greptile" → Greptile bot.
[pr_review]
# Stays "claude" deliberately. Greptile is being trialled on the sophie repo
# (backend = "greptile" there, 2026-07-25) and the GitHub App is NOT installed
# here — aatoolkit PRs report no checks at all. Do not install it or switch this
# until Greptile has earned confidence on sophie; the point of the trial is to
# have one repo's worth of evidence before spending it on two.
backend = "claude"
effort = "high"

# skip_confirm: don't prompt for the branch type on /slopstop-start — use the
# heuristic suggestion (from ticket labels/title) automatically. Only falls back
# to asking when the heuristic produces no suggestion at all.
# skip_archive=false: :merge always chains into :archive on terminal state.
[workflow]
skip_confirm = true
skip_archive = false
